<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Event Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="p-6 max-w-4xl mx-auto bg-gray-100">
    <h1 class="text-3xl font-bold mb-4 text-center fade-in">Interactive Event Calendar</h1>
    
    <div class="bg-white shadow-lg p-6 rounded-2xl mb-6">
        <form action="add_event.php" method="POST">
            <input type="date" id="eventDate" name="eventDate" class="w-full p-2 border rounded-md mb-2" required>
            <input type="text" id="eventTitle" name="eventTitle" placeholder="Event Title" class="w-full p-2 border rounded-md mb-2" required>
            <textarea id="eventDescription" name="eventDescription" placeholder="Event Description" class="w-full p-2 border rounded-md mb-2"></textarea>
            <input type="datetime-local" id="reminderTime" name="reminderTime" class="w-full p-2 border rounded-md mb-2">
            <button type="submit" class="w-full bg-green-500 text-white p-2 rounded-md hover:bg-green-600">Add Event</button>
        </form>
    </div>
    
    <div id="eventsList" class="bg-white shadow-lg p-6 rounded-2xl"></div>

    <script>
        const cursorDot = document.querySelector('#cursor-dot');
        const cursorOutline = document.querySelector('#cursor-outline');

        document.addEventListener('mousemove', (e) => {
            gsap.to(cursorDot, { x: e.clientX, y: e.clientY, duration: 0.01 });
            gsap.to(cursorOutline, { x: e.clientX, y: e.clientY, duration: 0.2, ease: "power2.out" });
        });
    </script>
</body>
</html>
